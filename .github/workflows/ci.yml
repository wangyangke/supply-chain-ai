name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate committed dataset snapshots (all targets)
        run: |
          python scripts/validate_data.py --data data/targets/nvidia
          python scripts/validate_data.py --data data/targets/unitree

      - name: Verify scores are engine-reproducible (dry-run, all targets)
        run: |
          python scripts/sync_scores.py --data data/targets/nvidia
          python scripts/sync_scores.py --data data/targets/unitree
