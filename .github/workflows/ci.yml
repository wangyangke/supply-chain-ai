name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install linkedom (DOM-level XSS render check)
        run: npm install --no-save linkedom

      - name: Run tests + coverage gate (>=90%)
        run: pytest --cov=src --cov-report=term-missing

      - name: Validate committed dataset snapshots (all targets)
        run: |
          for t in nvidia unitree; do
            python scripts/validate_data.py --data data/targets/$t
          done

      - name: Verify scores are engine-reproducible (all targets)
        run: |
          for t in nvidia unitree; do
            python scripts/sync_scores.py --data data/targets/$t
          done

      - name: Acceptance gate (data + scoring + methodology endpoint)
        run: python scripts/verify_gate.py
